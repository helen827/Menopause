name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app main.py
      - run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui-prototype
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui-prototype/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  ios:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run unit tests
        run: >-
          xcodebuild test
          -project ios/menocalmxia/menocalmxia.xcodeproj
          -scheme menocalmxia
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -only-testing:menocalmxiaTests
          CODE_SIGNING_ALLOWED=NO
