<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>呼吸练习 UI 预览</title>
  <style>
    :root {
      color-scheme: dark;
      --white: rgba(255,255,255,.94);
      --muted: rgba(255,255,255,.72);
      --glass: rgba(255,255,255,.14);
      --line: rgba(255,255,255,.18);
      --shadow: rgba(4,10,20,.38);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(124,168,202,.20), transparent 34%),
        radial-gradient(circle at 80% 15%, rgba(202,221,245,.12), transparent 30%),
        #07101b;
      overflow: hidden;
    }

    .phone {
      position: relative;
      width: min(100vw, 430px);
      height: min(100vh, 932px);
      min-height: 720px;
      overflow: hidden;
      background: #050913;
      box-shadow: 0 34px 90px rgba(0,0,0,.48);
      isolation: isolate;
    }

    @media (min-width: 520px) {
      .phone {
        border-radius: 42px;
        border: 1px solid rgba(255,255,255,.12);
      }
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity .55s ease, transform .7s ease;
    }

    .scene.active {
      opacity: 1;
      transform: scale(1);
    }

    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.26), transparent 24%, rgba(0,0,0,.18) 58%, rgba(0,0,0,.76)),
        radial-gradient(circle at 50% 44%, transparent 0 18%, rgba(0,0,0,.18) 45%, rgba(0,0,0,.54) 100%);
      pointer-events: none;
    }

    .meadow {
      background:
        radial-gradient(circle at 80% 15%, rgba(255,255,255,.46) 0 4%, transparent 12%),
        linear-gradient(to bottom, #718bf2 0%, #b8c6fb 34%, #8eb352 55%, #22440f 78%, #031006 100%);
    }

    .meadow .hill {
      position: absolute;
      left: -18%;
      width: 136%;
      height: 42%;
      bottom: -8%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(160deg, rgba(179,219,83,.95), rgba(28,75,22,.94));
      filter: blur(1px);
    }

    .meadow .hill:nth-child(2) {
      bottom: 5%;
      left: -30%;
      background: linear-gradient(160deg, rgba(159,203,74,.78), rgba(24,65,24,.70));
      transform: rotate(-4deg);
      filter: blur(4px);
    }

    .blade {
      position: absolute;
      bottom: 0;
      width: 3px;
      height: var(--h);
      left: var(--x);
      border-radius: 99px;
      background: linear-gradient(to top, rgba(25,72,21,.9), rgba(212,232,93,.9));
      transform-origin: bottom;
      animation: sway 3.8s ease-in-out infinite;
      animation-delay: var(--d);
      filter: blur(var(--b));
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(8deg); }
    }

    .sleep {
      background:
        radial-gradient(circle at 40% 18%, rgba(130,174,232,.18), transparent 30%),
        linear-gradient(to bottom, #02040b 0%, #071023 32%, #173657 56%, #030711 100%);
    }

    .earth {
      position: absolute;
      left: 50%;
      bottom: -14%;
      width: 145%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 68% 22%, rgba(255,255,255,.35), transparent 13%),
        linear-gradient(130deg, #8fbde7 0%, #2a5b88 36%, #16304d 60%, #020612 100%);
      box-shadow: 0 -10px 34px rgba(118,174,244,.38), inset 0 24px 56px rgba(255,255,255,.16);
    }

    .earth::before {
      content: "";
      position: absolute;
      inset: 13% 5% auto;
      height: 12%;
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      filter: blur(12px);
      transform: rotate(-8deg);
      box-shadow: 0 64px 0 rgba(255,255,255,.08), 0 116px 0 rgba(255,255,255,.06);
    }

    .star {
      position: absolute;
      width: var(--s);
      height: var(--s);
      left: var(--x);
      top: var(--y);
      border-radius: 50%;
      background: rgba(255,255,255,.76);
      animation: twinkle 2.8s ease-in-out infinite;
      animation-delay: var(--d);
    }

    @keyframes twinkle {
      0%, 100% { opacity: .25; transform: scale(.78); }
      50% { opacity: .9; transform: scale(1.18); }
    }

    .cool {
      background:
        radial-gradient(circle at 30% 18%, rgba(214,240,255,.22), transparent 26%),
        linear-gradient(to bottom, #4f7188 0%, #8aa1aa 36%, #385c69 58%, #07131a 100%);
    }

    .mist {
      position: absolute;
      width: var(--w);
      height: 4px;
      left: var(--x);
      top: var(--y);
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      filter: blur(4px);
      animation: drift 9s linear infinite;
      animation-delay: var(--d);
    }

    @keyframes drift {
      from { transform: translateX(-70px); }
      to { transform: translateX(180px); }
    }

    .cool .wave {
      position: absolute;
      left: -12%;
      bottom: 16%;
      width: 128%;
      height: 36%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(to bottom, rgba(112,154,166,.62), rgba(7,20,27,.82));
      filter: blur(6px);
      transform: rotate(-2deg);
    }

    .ui {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: max(24px, env(safe-area-inset-top)) 22px max(18px, env(safe-area-inset-bottom));
      touch-action: pan-y;
    }

    .topbar {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      padding-top: 10px;
    }

    .topbar h1 {
      margin: 0;
      color: white;
      font-size: 29px;
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: 0;
    }

    .topbar p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
    }

    .icon-btn {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: white;
      background: var(--glass);
      backdrop-filter: blur(18px);
      font-size: 20px;
      cursor: pointer;
      user-select: none;
    }

    .spacer { flex: 1; min-height: 18px; }

    .orb-wrap {
      display: grid;
      place-items: center;
      margin-bottom: 20px;
    }

    .orb {
      position: relative;
      width: min(72vw, 304px);
      height: min(72vw, 304px);
      display: grid;
      place-items: center;
      transform: scale(var(--orb-scale, .78));
      transition: transform .22s linear;
    }

    .orb::before,
    .orb::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }

    .orb::before {
      transform: scale(1.22);
      background: color-mix(in srgb, var(--accent) 26%, transparent);
      filter: blur(9px);
    }

    .orb::after {
      transform: scale(1.1);
      border: 2px solid rgba(255,255,255,.58);
      box-shadow: 0 0 24px rgba(255,255,255,.48);
    }

    .orb-core {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle at 34% 25%, rgba(255,255,255,.76), transparent 19%),
        radial-gradient(circle at 50% 50%, var(--primary), var(--deep));
      box-shadow: 0 0 50px color-mix(in srgb, var(--accent) 62%, transparent);
    }

    .orb-core::after {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 24px solid color-mix(in srgb, var(--accent) 34%, transparent);
      filter: blur(.5px);
    }

    .orb-content {
      position: relative;
      z-index: 2;
      text-align: center;
      transform: scale(calc(1 / var(--orb-scale, 1)));
      transition: transform .22s linear;
      width: 72%;
      color: white;
    }

    .phase-icon {
      font-size: 38px;
      margin-bottom: 8px;
      opacity: .9;
    }

    .phase {
      font-size: 25px;
      line-height: 1;
      font-weight: 850;
    }

    .count {
      margin-top: 8px;
      font-size: 46px;
      line-height: 1;
      font-weight: 250;
      font-variant-numeric: tabular-nums;
      opacity: .9;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
      color: rgba(255,255,255,.66);
    }

    .title {
      text-align: center;
      margin-bottom: 18px;
    }

    .title h2 {
      margin: 0;
      color: white;
      font-size: 30px;
      line-height: 1.08;
      font-weight: 850;
    }

    .title .en {
      margin-top: 8px;
      color: rgba(255,255,255,.70);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 6px;
    }

    .rhythm {
      display: inline-flex;
      margin-top: 12px;
      min-height: 32px;
      align-items: center;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      color: rgba(255,255,255,.84);
      font-size: 14px;
      font-weight: 750;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 17px;
    }

    .mode {
      min-width: 0;
      min-height: 53px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: rgba(255,255,255,.78);
      cursor: pointer;
      backdrop-filter: blur(18px);
    }

    .mode.active {
      color: #111a25;
      background: rgba(255,255,255,.92);
      border-color: rgba(255,255,255,.30);
    }

    .mode strong,
    .mode span {
      display: block;
      white-space: nowrap;
    }

    .mode strong {
      font-size: 12px;
      font-weight: 900;
    }

    .mode span {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 800;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 8px;
      margin-bottom: 17px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.32);
      transition: width .24s ease, background .24s ease;
    }

    .dot.active {
      width: 28px;
      background: white;
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .primary {
      flex: 1;
      height: 58px;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      color: #111a25;
      font-size: 17px;
      font-weight: 900;
      box-shadow: 0 14px 34px color-mix(in srgb, var(--accent) 30%, transparent);
      cursor: pointer;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden-guidance .hint,
    .hidden-guidance .count,
    .hidden-guidance .phase {
      display: none;
    }

    @media (max-height: 760px) {
      .phone { min-height: 660px; }
      .topbar h1 { font-size: 25px; }
      .orb { width: min(58vw, 250px); height: min(58vw, 250px); }
      .title h2 { font-size: 25px; }
      .modes { margin-bottom: 12px; }
      .mode { min-height: 48px; }
      .controls { gap: 10px; }
      .icon-btn { width: 44px; height: 44px; }
      .primary { height: 54px; }
    }
  </style>
</head>
<body>
  <main class="phone" id="phone">
    <section class="scene meadow" data-scene="0">
      <div class="hill"></div>
      <div class="hill"></div>
    </section>
    <section class="scene sleep active" data-scene="1">
      <div class="earth"></div>
    </section>
    <section class="scene cool" data-scene="2">
      <div class="wave"></div>
    </section>

    <section class="ui" id="ui">
      <header class="topbar">
        <div>
          <h1>呼吸练习</h1>
          <p id="subtitle">助眠安睡 · 吸 4 秒，停 7 秒，呼 8 秒</p>
        </div>
        <div class="spacer"></div>
        <button class="icon-btn" id="guideBtn" aria-label="切换文字引导">☰</button>
      </header>

      <div class="spacer"></div>

      <div class="orb-wrap">
        <div class="orb" id="orb">
          <div class="orb-core">
            <div class="orb-content">
              <div class="phase-icon" id="phaseIcon">☾</div>
              <div class="phase" id="phaseText">停留</div>
              <div class="count" id="countText">7</div>
              <div class="hint" id="hintText">轻轻停住，不用用力</div>
            </div>
          </div>
        </div>
      </div>

      <section class="title">
        <h2 id="sceneName">深睡轨道</h2>
        <div class="en" id="sceneLabel">SLEEP RESET</div>
        <div class="rhythm" id="rhythmText">吸 4s · 停 7s · 呼 8s</div>
      </section>

      <nav class="modes" aria-label="呼吸模式">
        <button class="mode" data-mode="0"><strong>舒缓心情</strong><span>4-6</span></button>
        <button class="mode active" data-mode="1"><strong>助眠安睡</strong><span>4-7-8</span></button>
        <button class="mode" data-mode="2"><strong>缓解潮热</strong><span>5-5</span></button>
      </nav>

      <div class="dots">
        <span class="dot"></span>
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>

      <footer class="controls">
        <button class="icon-btn" id="prevBtn" aria-label="上一个模式">‹</button>
        <button class="primary" id="playBtn">暂停</button>
        <button class="icon-btn" id="soundBtn" aria-label="切换声音">◖</button>
        <button class="icon-btn" id="nextBtn" aria-label="下一个模式">›</button>
      </footer>
    </section>
  </main>

  <script>
    const modes = [
      {
        title: "舒缓心情",
        subtitle: "舒缓心情 · 吸 4 秒，呼 6 秒",
        sceneName: "柔风麦田",
        sceneLabel: "MOOD RESET",
        rhythm: "吸 4s · 呼 6s",
        phases: [
          { key: "inhale", label: "吸气", seconds: 4, icon: "≋", hint: "把空气带到胸口" },
          { key: "exhale", label: "呼气", seconds: 6, icon: "✦", hint: "把烦躁随呼气放远" }
        ],
        colors: { primary: "#b8dc78", accent: "#f0fb9b", deep: "#255219" }
      },
      {
        title: "助眠安睡",
        subtitle: "助眠安睡 · 吸 4 秒，停 7 秒，呼 8 秒",
        sceneName: "深睡轨道",
        sceneLabel: "SLEEP RESET",
        rhythm: "吸 4s · 停 7s · 呼 8s",
        phases: [
          { key: "inhale", label: "吸气", seconds: 4, icon: "≋", hint: "把空气带到胸口" },
          { key: "hold", label: "停留", seconds: 7, icon: "☾", hint: "轻轻停住，不用用力" },
          { key: "exhale", label: "呼气", seconds: 8, icon: "✦", hint: "让肩颈向下沉一点" }
        ],
        colors: { primary: "#8bb8f2", accent: "#b8d3ff", deep: "#0a1430" }
      },
      {
        title: "缓解潮热",
        subtitle: "缓解潮热 · 吸 5 秒，呼 5 秒",
        sceneName: "清凉潮汐",
        sceneLabel: "HOT FLASH",
        rhythm: "吸 5s · 呼 5s",
        phases: [
          { key: "inhale", label: "吸气", seconds: 5, icon: "≋", hint: "吸入清凉的空气" },
          { key: "exhale", label: "呼气", seconds: 5, icon: "✦", hint: "让热感慢慢散开" }
        ],
        colors: { primary: "#80c4ef", accent: "#c2e8ff", deep: "#1a3b56" }
      }
    ];

    const phone = document.getElementById("phone");
    const ui = document.getElementById("ui");
    const scenes = Array.from(document.querySelectorAll(".scene"));
    const modeButtons = Array.from(document.querySelectorAll(".mode"));
    const dots = Array.from(document.querySelectorAll(".dot"));
    const subtitle = document.getElementById("subtitle");
    const orb = document.getElementById("orb");
    const phaseIcon = document.getElementById("phaseIcon");
    const phaseText = document.getElementById("phaseText");
    const countText = document.getElementById("countText");
    const hintText = document.getElementById("hintText");
    const sceneName = document.getElementById("sceneName");
    const sceneLabel = document.getElementById("sceneLabel");
    const rhythmText = document.getElementById("rhythmText");
    const playBtn = document.getElementById("playBtn");
    const soundBtn = document.getElementById("soundBtn");
    const guideBtn = document.getElementById("guideBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    let activeMode = 1;
    let running = true;
    let sound = true;
    let guidance = true;
    let cycleStart = performance.now();
    let pausedAt = 0;
    let touchStartX = 0;

    function totalDuration(mode) {
      return mode.phases.reduce((sum, phase) => sum + phase.seconds, 0);
    }

    function smooth(value) {
      return 0.5 - Math.cos(value * Math.PI) / 2;
    }

    function phaseAt(mode, elapsed) {
      const total = totalDuration(mode);
      let cursor = 0;
      const cycle = elapsed % total;
      for (const phase of mode.phases) {
        const next = cursor + phase.seconds;
        if (cycle < next) {
          const local = cycle - cursor;
          return { phase, progress: local / phase.seconds, remaining: Math.max(1, Math.ceil(phase.seconds - local)) };
        }
        cursor = next;
      }
      return { phase: mode.phases[mode.phases.length - 1], progress: 1, remaining: 1 };
    }

    function scaleFor(step) {
      if (step.phase.key === "inhale") return 0.78 + smooth(step.progress) * 0.28;
      if (step.phase.key === "hold") return 1.06;
      return 1.06 - smooth(step.progress) * 0.28;
    }

    function setMode(index) {
      activeMode = (index + modes.length) % modes.length;
      cycleStart = performance.now();
      pausedAt = 0;
      const mode = modes[activeMode];
      subtitle.textContent = mode.subtitle;
      sceneName.textContent = mode.sceneName;
      sceneLabel.textContent = mode.sceneLabel;
      rhythmText.textContent = mode.rhythm;
      phone.style.setProperty("--primary", mode.colors.primary);
      phone.style.setProperty("--accent", mode.colors.accent);
      phone.style.setProperty("--deep", mode.colors.deep);

      scenes.forEach((scene, sceneIndex) => scene.classList.toggle("active", sceneIndex === activeMode));
      modeButtons.forEach((button, buttonIndex) => button.classList.toggle("active", buttonIndex === activeMode));
      dots.forEach((dot, dotIndex) => dot.classList.toggle("active", dotIndex === activeMode));
    }

    function animate(now) {
      const mode = modes[activeMode];
      const elapsed = running ? (now - cycleStart) / 1000 : pausedAt;
      const step = phaseAt(mode, elapsed);
      const scale = scaleFor(step);

      orb.style.setProperty("--orb-scale", scale.toFixed(3));
      phaseIcon.textContent = step.phase.icon;
      phaseText.textContent = step.phase.label;
      countText.textContent = step.remaining;
      hintText.textContent = step.phase.hint;

      requestAnimationFrame(animate);
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => setMode(Number(button.dataset.mode)));
    });

    prevBtn.addEventListener("click", () => setMode(activeMode - 1));
    nextBtn.addEventListener("click", () => setMode(activeMode + 1));

    playBtn.addEventListener("click", () => {
      const now = performance.now();
      if (running) {
        pausedAt = ((now - cycleStart) / 1000) % totalDuration(modes[activeMode]);
      } else {
        cycleStart = now - pausedAt * 1000;
      }
      running = !running;
      playBtn.textContent = running ? "暂停" : "继续";
    });

    soundBtn.addEventListener("click", () => {
      sound = !sound;
      soundBtn.textContent = sound ? "◖" : "×";
    });

    guideBtn.addEventListener("click", () => {
      guidance = !guidance;
      ui.classList.toggle("hidden-guidance", !guidance);
      guideBtn.textContent = guidance ? "☰" : "◌";
    });

    ui.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    ui.addEventListener("touchend", event => {
      const delta = event.changedTouches[0].clientX - touchStartX;
      if (Math.abs(delta) > 54) setMode(activeMode + (delta < 0 ? 1 : -1));
    }, { passive: true });

    function seedDecorations() {
      const meadow = document.querySelector(".meadow");
      for (let i = 0; i < 34; i++) {
        const blade = document.createElement("span");
        blade.className = "blade";
        blade.style.setProperty("--x", `${(i * 29) % 100}%`);
        blade.style.setProperty("--h", `${72 + (i % 6) * 13}px`);
        blade.style.setProperty("--d", `${-(i % 9) * .28}s`);
        blade.style.setProperty("--b", i < 8 ? "2.4px" : ".25px");
        meadow.appendChild(blade);
      }

      const sleep = document.querySelector(".sleep");
      for (let i = 0; i < 42; i++) {
        const star = document.createElement("span");
        star.className = "star";
        star.style.setProperty("--x", `${(i * 37) % 100}%`);
        star.style.setProperty("--y", `${(i * 23) % 42}%`);
        star.style.setProperty("--s", `${1 + (i % 3)}px`);
        star.style.setProperty("--d", `${-(i % 8) * .23}s`);
        sleep.appendChild(star);
      }

      const cool = document.querySelector(".cool");
      for (let i = 0; i < 16; i++) {
        const mist = document.createElement("span");
        mist.className = "mist";
        mist.style.setProperty("--x", `${-10 + (i * 13) % 110}%`);
        mist.style.setProperty("--y", `${31 + (i % 7) * 5.5}%`);
        mist.style.setProperty("--w", `${80 + (i % 4) * 28}px`);
        mist.style.setProperty("--d", `${-(i % 6) * .75}s`);
        cool.appendChild(mist);
      }
    }

    seedDecorations();
    setMode(activeMode);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
